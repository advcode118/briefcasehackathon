[project]
name = "proven"
version = "0.1.0"
description = "A payments agent whose spending policy is proven, not prompted."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "z3-solver>=4.12",
    "stripe>=9.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
