<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProofPay · Policies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/journal.css" />
  <style>
    body { font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; line-height: 1.45; }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 32px 40px; }
    @media (max-width: 640px) { .wrap { padding: 24px 16px; } }
    h1 { font-size: 28px; font-weight: 600; margin: 28px 0 4px; letter-spacing: -.01em; }
    .lede { margin: 0; font-style: italic; color: #4a4438; }
    h2 { font-size: 21px; font-weight: 600; margin: 36px 0 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 20px; }
    .card { border: 1px solid #e3ddcd; border-radius: 10px; background: #fff; padding: 20px 22px; box-shadow: 0 1px 2px rgba(26,26,26,.04), 0 4px 14px rgba(26,26,26,.04); }
    .card h3 { font-size: 18px; font-weight: 600; margin: 0; }
    .card .desc { margin: 2px 0 12px; font-size: 14px; font-style: italic; color: #6b6457; }
    .rule { padding: 8px 0; border-top: 1px solid #ece8dc; }
    .chip { font-family: Inter, system-ui, sans-serif; font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
    .c-proved { background: #e3efe8; color: #2f6f4f; }
    .thms { list-style: none; margin: 0; padding: 0; border-top: 2px solid #1a1a1a; border-bottom: 2px solid #1a1a1a; }
    .thms li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 2px; border-bottom: 1px solid #e3ddcd; font-size: 15.5px; }
    .thms li:last-child { border-bottom: 0; }
    .empty { padding: 24px 0; text-align: center; font-style: italic; color: #8b8373; }
    .err { margin-top: 12px; border: 1px solid rgba(163,48,42,.4); padding: 6px 12px; font-size: 13px; color: #a3302a; }
  </style>
</head>
<body data-page="settings">
  <div class="wrap">
    <header id="masthead"></header>
    <div id="conn"></div>
    <h1>Policies</h1>
    <p class="lede">The rules every payment is checked against, and what has been proven about them.</p>
    <div id="cards" class="cards"><div class="empty">Loading…</div></div>
    <h2>Guarantees</h2>
    <ul id="theorems" class="thms"><li class="empty" style="display:block">Loading…</li></ul>
  </div>
  <script src="/static/mock.js"></script>
  <script src="/static/header.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
